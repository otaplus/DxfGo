name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.x]

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Las pruebas simulan Electron y no necesitan su binario, así que se evita
      # descargar ~100 MB por cada sistema operativo.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Ejecutar pruebas
        run: npm test
